# PCLabel taxonomy: the source of truth for class ids, names, colours and flags.
# When to use each class is in docs/LABELLING_STANDARD.md, one section per class.
#
# The classes form a tree (the user's decision of 2026-11-04): a class is a kind of its `parent`.
#   - Use the most specific label that fits. Use the parent when no sub-label covers it, when you are not sure which
#     one, or to label quickly (the user's words, 2026-11-04).
#   - Counting a class counts its sub-classes too (a road_line point is a road point). Where point sets overlap along
#     one branch (a road set holding its lines), the most specific label is the point's; overlaps across branches
#     (road and pavement) are conflicts.
#   - Moving a class to another parent changes what it rolls up to, without relabelling anything.
#   - The file lists the classes in tree order (a parent before its children); menus show them that way.
#
# color     one hue family per kind (the user's request, 2026-11-05)
# id        uint8, stable forever. Never reuse or renumber an id; disable a class instead.
# parent    the class this one is a kind of (none: top level)
# only      line   = only lines (segments, curves, polylines) take it
#           marker = only markers take it (a position: where a thing is)
#           [line, marker] = both
#           (absent: point sets, lines and markers all take it)
# status    core      = in the user's standard
#           optional  = in the standard as a finer kind the labeller may use, never required
#           proposed  = not in the user's standard yet; the user decides
#           import    = kept so vendor drawings and older labels load; not for new labels
#           retired   = the user's standard has no such class; kept so old label files load
# enabled   shown in the label menus. Disabled classes stay valid in old label files.
# countable points of this class may carry instance ids (one id per object)
# key       default hotkey ("shift+N" for the second row). "0" erases to unassessed.
# selectable  false: points with this class are never selected by any tool. Default true.

schema: pclabel.taxonomy/2
version: "0.7"

classes:
  - {id: 0,   name: unassessed,         status: core,     enabled: true,  color: "#8E8E93", key: "0",
     def: "not yet looked at. Never means 'not X'."}

  - {id: 100, name: ground,             status: core,     enabled: true,  color: "#A1887F",
     def: "the ground surface; use a sub-label where one fits"}
  - {id: 1,   name: road,               parent: ground,   status: core,     enabled: true,  color: "#3F51B5", key: "1",
     def: "everything bounded by the lower stage of the curbs, including flat features that can be driven over; not the strip beside the road"}
  - {id: 10,  name: road_line,          parent: road,     status: core,     enabled: true,  color: "#D6DBFF",
     def: "painted lines and markings on the road; also road (the only points with two classes)"}
  - {id: 8,   name: driveway,           parent: road,     status: core,     enabled: true,  color: "#283593",
     def: "vehicle crossing over the pavement; a kind of road (the user, 2026-11-04)"}
  - {id: 9,   name: ramp,               parent: road,     status: core,     enabled: true,  color: "#8E7CC3",
     def: "the part of a ramp more than 0.1 m above a plane fitted to the road around it; a kind of road (the user, 2026-11-16)"}
  - {id: 12,  name: parking,            parent: road,     status: proposed, enabled: false, color: "#5C8DF6",
     def: "parking bays and car park surfaces"}
  - {id: 11,  name: gutter,             parent: ground,   status: import,   enabled: false, color: "#7986CB",
     def: "a vendor drawing's gutter line; in the standard the strip beside the road has no label"}
  - {id: 2,   name: curb,               parent: ground,   status: core,     enabled: true,  color: "#E53935", key: "2", only: line,
     def: "a curve along the top, outermost edge of the raised curb; one curve per area, straight across lowered sections"}
  - {id: 13,  name: curb_top,           parent: curb,     status: import,   enabled: false, color: "#FF8A80", only: line,
     def: "the same line as curb: what the curb tracer, vendor drawings (TOP_OF_CURB) and older labels write"}
  - {id: 14,  name: curb_bottom,        parent: curb,     status: import,   enabled: false, color: "#B71C1C", only: line,
     def: "a vendor drawing's curb toe (BOTTOM_OF_CURB); not part of the standard"}
  - {id: 15,  name: curb_back,          parent: curb,     status: import,   enabled: false, color: "#D81B60", only: line,
     def: "a vendor drawing's back of curb (BACK_OF_CURB); not part of the standard"}
  - {id: 3,   name: curb_lowered,       parent: curb,     status: retired,  enabled: false, color: "#FF7043",
     def: "retired: the curb curve runs straight across a lowered section"}
  - {id: 4,   name: pavement,           parent: ground,   status: core,     enabled: true,  color: "#FFD60A", key: "3",
     def: "where pedestrians walk, including tactile paving and the slope down to the road, up to a 5 cm inset from the curb curve"}
  - {id: 16,  name: cover,              parent: ground,   status: proposed, enabled: true,  color: "#26A69A", only: [line, marker],
     def: "a manhole or utility cover: a marker at its centre, or its outline (future work: not labelled for now)"}
  - {id: 5,   name: drain,              parent: ground,   status: retired,  enabled: false, color: "#00BCD4", countable: true,
     def: "retired: drains lie in the unlabelled strip beside the road; a flat drain cover in the road is road"}
  - {id: 17,  name: hard_surface,       parent: ground,   status: proposed, enabled: false, color: "#BCAAA4",
     def: "other paved ground, neither road nor pavement"}
  - {id: 7,   name: island,             parent: ground,   status: proposed, enabled: false, color: "#F06292",
     def: "top of a raised traffic island or median"}

  - {id: 101, name: vegetation,         status: core,     enabled: true,  color: "#43A047", key: "5",
     def: "plants without a trunk at least 1 m long, and saplings under 2 m; no instances"}
  - {id: 6,   name: grass,              parent: vegetation, status: optional, enabled: true, color: "#9CCC65",
     def: "grass and low ground cover"}
  - {id: 20,  name: shrub_hedge,        parent: vegetation, status: optional, enabled: true, color: "#7CB342", key: "shift+2",
     def: "shrubs, hedges, planted beds above ground cover"}

  - {id: 23,  name: tree,               status: core,     enabled: true,  color: "#2E7D32", countable: true,
     def: "one tree: a marker where it stands, from a circle fitted to its trunk 1.00-1.10 m above its foot"}
  - {id: 21,  name: tree_trunk,         parent: tree,     status: core,     enabled: true,  color: "#689F38", key: "6", countable: true,
     def: "the band of a tree's trunk 1.00-1.10 m above its foot"}
  - {id: 22,  name: tree_canopy,        parent: tree,     status: retired,  enabled: false, color: "#66BB6A", countable: true,
     def: "retired: canopies are not labelled"}

  - {id: 102, name: pole,               status: core,     enabled: true,  color: "#AB47BC", countable: true,
     def: "pole-like objects: a marker at the height of the ground around it, at the middle of the shape; use a sub-label where one fits"}
  - {id: 33,  name: lta_lamp_post,      parent: pole,     status: core,     enabled: true,  color: "#9C27B0", key: "shift+1", countable: true,
     def: "a lamp post registered with LTA; its marker's asset_id attribute is its LTA lamp post number (the user, 2026-11-16)"}
  - {id: 30,  name: lamp_post,          parent: pole,     status: core,     enabled: true,  color: "#E040FB", key: "8", countable: true,
     def: "a privately owned lamp post, not registered with LTA; every lamp post labelled before 2026-11-16 is one (the user, 2026-11-16)"}
  - {id: 31,  name: traffic_light_pole, parent: pole,     status: core,     enabled: true,  color: "#7E57C2", key: "shift+3", countable: true,
     def: "traffic signal pole"}
  - {id: 32,  name: other_pole,         parent: pole,     status: core,     enabled: true,  color: "#CE93D8", key: "shift+4", countable: true,
     def: "usually road signage (sign posts); also bollards, camera poles, utility poles and other pole-like objects"}

  - {id: 103, name: structure,          status: proposed, enabled: true,  color: "#9E9E9E",
     def: "built structures and furniture; use a sub-label where one fits"}
  - {id: 40,  name: building_wall,      parent: structure, status: proposed, enabled: true, color: "#CFD8DC",
     def: "building facades and boundary walls of buildings; a line labelled building_wall is a footprint"}
  - {id: 45,  name: wall,               parent: structure, status: proposed, enabled: true, color: "#90A4AE",
     def: "free-standing and retaining walls"}
  - {id: 41,  name: fence_railing,      parent: structure, status: proposed, enabled: true, color: "#BCB4AC",
     def: "railings, hand rails, pedestrian guardrails, fences"}
  - {id: 43,  name: barrier,            parent: structure, status: proposed, enabled: true, color: "#ECEFF1",
     def: "crash barriers, guard rails along the road, concrete road barriers"}
  - {id: 42,  name: roof_shelter,       parent: structure, status: proposed, enabled: true, color: "#607D8B",
     def: "covered-linkway roofs, bus shelters, canopies"}
  - {id: 46,  name: bridge,             parent: structure, status: proposed, enabled: true, color: "#B0BEC5",
     def: "overhead pedestrian bridges and other bridges"}
  - {id: 44,  name: street_furniture,   parent: structure, status: proposed, enabled: true, color: "#78909C", countable: true,
     def: "benches, bins, hydrants, cabinets, bicycle racks"}

  - {id: 104, name: temporary,          status: proposed, enabled: true,  color: "#FF9800",
     def: "temporary and moving things; use a sub-label where one fits"}
  - {id: 50,  name: vehicle,            parent: temporary, status: proposed, enabled: true, color: "#F57C00", key: "shift+5", countable: true,
     def: "parked or stationary vehicles"}
  - {id: 51,  name: person,             parent: temporary, status: proposed, enabled: true, color: "#FFB74D", key: "shift+6", countable: true,
     def: "people"}
  - {id: 52,  name: temporary_object,   parent: temporary, status: proposed, enabled: true, color: "#FF6F00", key: "shift+7", countable: true,
     def: "cones, barricades, incident equipment, construction items"}
  - {id: 53,  name: ghost,              parent: temporary, status: proposed, enabled: true, color: "#FFE0B2", key: "shift+8",
     def: "streaks left by objects that moved during the scan"}

  - {id: 60,  name: noise,              status: proposed, enabled: true,  color: "#424242", key: "shift+9",
     def: "isolated points, mixed pixels off any surface, below-ground multipath, sky noise"}
  - {id: 61,  name: other,              status: core,     enabled: true,  color: "#F5F5F5", key: "9",
     selectable: false,
     def: "assessed, but fits no class; 'no class': never selected"}

# The labels tools give what they make (pclabel.taxonomy.TOOL_LABELS has every key and its default; "" = no label).
tools:
  curb_trace_lip: curb
  curb_trace_toe: ""
  marking_trace: road_line
  tree_band: tree_trunk
  pole_kinds: pole
  cover: cover
  clearance: [vegetation, tree]

# Per-point flags (uint8 bitfield, independent of the class). "Uncertain" is a mark on an item, not a flag.
flags:
  # bit 0 is retired (it was `ambiguous`; the user marks uncertainty on items, 2026-11-16). Never reuse it.
  - {bit: 1, name: marking,     def: "painted marking on a surface that is not road (paint on the road is road_line)"}
  - {bit: 2, name: under_cover, def: "under a roof or canopy; RGB and intensity behave differently"}
  - {bit: 3, name: exclude,     def: "exclude from scoring (artefacts, scan edge, known bad data)"}
  - {bit: 4, name: reviewed,    def: "checked in a review pass"}
  # bits 5-7 reserved: the renderer uses them on the GPU only, for highlights (7 selected, 6 preview group, 5 to look at)
